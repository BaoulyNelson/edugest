# Reverse proxy nginx : TLS terminé en amont (CDN ou répartiteur de charge) ou ici en ajoutant les directives ssl_*.
worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; keepalive_timeout 65; server_tokens off;
  client_max_body_size 12m;   # fichiers déposés (10 Mo) + formulaire
  gzip on; gzip_comp_level 5; gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  resolver 127.0.0.11 valid=10s;                       # DNS Docker : suit les réplicas du service « web »
  limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:20m max_size=500m inactive=1h use_temp_path=off;

  upstream application { server web:8000 max_fails=3 fail_timeout=10s; keepalive 32; }
  map $http_x_forwarded_proto $schema_client { default $scheme; https https; }

  server {
    listen 80 default_server;
    server_name _;       # domaine principal et tous les sous-domaines d'établissements (*.votre-domaine)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Fichiers statiques versionnés : cache d'un an (nginx, CDN et navigateur)
    location /statique/ {
      proxy_pass http://application;
      proxy_cache public; proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sondes de santé : jamais limitées ni mises en cache
    location /sante/ { proxy_pass http://application; access_log off; proxy_cache off; }

    # Pages d'authentification : limitation anti force brute
    location = /comptes/connexion/ { limit_req zone=connexion burst=10 nodelay; include /etc/nginx/proxy_commun.conf; }

    # Pages publiques du site vitrine : micro-cache (respecte Cache-Control public de l'application)
    location ~ ^/(vitrine|tarifs|fonctionnalites|conditions|confidentialite|mentions-legales)/$ {
      proxy_cache public; proxy_cache_key "$host$uri$arg_lang"; proxy_cache_valid 200 5m;
      proxy_ignore_headers Vary Set-Cookie; proxy_hide_header Set-Cookie;
      add_header X-Cache $upstream_cache_status;
      include /etc/nginx/proxy_commun.conf;
    }

    location / { limit_req zone=general burst=60 nodelay; include /etc/nginx/proxy_commun.conf; }
  }
}
