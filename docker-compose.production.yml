# Déploiement de production sur un hôte (ou Docker Swarm) : application répliquée, base, cache, proxy, planificateur.
#   docker compose -f docker-compose.production.yml --env-file .env up -d --scale web=3
# Pour la haute disponibilité multi-hôtes, préférer deploiement/kubernetes/.
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: ${BD_NOM}
      MYSQL_USER: ${BD_UTILISATEUR}
      MYSQL_PASSWORD: ${BD_MOT_DE_PASSE}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [donnees_bd:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [donnees_redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped

  migration:
    build: { context: ., dockerfile: deploiement/Dockerfile }
    env_file: .env
    environment: { EXECUTER_MIGRATIONS: "1", BD_HOTE: db, URL_REDIS: "redis://redis:6379/1" }
    command: ["true"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: deploiement/Dockerfile }
    env_file: .env
    environment: { BD_HOTE: db, URL_REDIS: "redis://redis:6379/1", DEBUG: "False" }
    volumes: [fichiers_utilisateurs:/app/media]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy }, migration: { condition: service_completed_successfully } }
    deploy: { replicas: 2, update_config: { order: start-first, parallelism: 1 }, restart_policy: { condition: any } }
    restart: unless-stopped

  planificateur:
    build: { context: ., dockerfile: deploiement/Dockerfile }
    env_file: .env
    environment: { BD_HOTE: db, URL_REDIS: "redis://redis:6379/1", NOM_NOEUD: planificateur, DOSSIER_SAUVEGARDES: /sauvegardes }
    volumes: [fichiers_utilisateurs:/app/media, sauvegardes:/sauvegardes]
    entrypoint: ["/app/deploiement/entrypoint.sh"]
    command: ["/app/deploiement/planificateur.sh"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploiement/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploiement/proxy_commun.conf:/etc/nginx/proxy_commun.conf:ro
    depends_on: [web]
    restart: unless-stopped

volumes: { donnees_bd: {}, donnees_redis: {}, fichiers_utilisateurs: {}, sauvegardes: {} }
